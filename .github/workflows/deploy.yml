name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

# O plan roda ANTES da aprovação e o apply aplica o arquivo exato que foi
# planejado: quem aprova o environment vê o que vai mudar. O if de main
# sozinho não segura nada (quem clica no dispatch escolhe a branch); quem
# segura é a deployment branch policy do environment production no GitHub.

# Vazio no topo: sem a chave o checkov (CKV2_GHA_1) lê write-all. Cada job
# declara o seu e nada é herdado.
permissions: {}

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Sem environment de propósito: a aprovação só vem depois de o plan existir.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      # Só leitura: este job não tem environment, então o sub do token é
      # ref:refs/heads/main, que o trust do gha-plan aceita desde o ADR 7.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform -chdir=infra init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Sem pipe: bash -e sem pipefail esconderia a falha do plan.
      - name: terraform plan
        run: |
          terraform -chdir=infra plan -lock=false -input=false -no-color -out=tfplan > plan.txt 2>&1 \
            || { cat plan.txt; exit 1; }
          cat plan.txt
          # Cerca mais longa que qualquer sequência de crases do plan; com cerca fixa,
          # um plan com crase tripla fecharia o bloco na tela que o aprovador lê.
          maior=$(grep -o '`\+' plan.txt | awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')
          n=$(( maior + 1 > 3 ? maior + 1 : 3 ))
          cerca=$(printf '%*s' "$n" '' | tr ' ' '`')
          { echo '### terraform plan'; echo "$cerca"; cat plan.txt; echo "$cerca"; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: |
            infra/tfplan
            app/handler.zip
            plan.txt
          if-no-files-found: error
          retention-days: 1

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # O trust do gha-deploy casa com environment:production (ADR 3); o GitHub
    # só libera o job depois da aprovação manual configurada no environment.
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan

      # O zip da Lambda nasce do data.archive_file durante o plan e o apply do plano
      # salvo não re-lê o data source: o create da função lê o arquivo do disco.
      # Falhar aqui é mais claro que o "no such file" no meio do apply.
      - name: conferir artifact
        run: test -f infra/tfplan && test -f app/handler.zip

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform -chdir=infra init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # O artifact restaura infra/tfplan; o terraform recusa o arquivo se o
      # state mudou desde o plan, então um apply "velho" falha em vez de surpreender.
      - name: terraform apply
        run: terraform -chdir=infra apply -input=false tfplan
